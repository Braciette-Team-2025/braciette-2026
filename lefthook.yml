# lefthook.yml
pre-commit:
  parallel: true
  commands:
    linter:
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files} --fix

    formatter:
      glob: "*.{js,jsx,ts,tsx,css,json,md}"
      run: npx prettier --write {staged_files}
